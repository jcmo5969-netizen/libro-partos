# nginx — reverse proxy con TLS para Libro de Partos.
# Copia a /etc/nginx/sites-available/ y ajusta server_name, rutas de certificado y dist/.
# Certificado: usa certbot (Let's Encrypt) o el certificado institucional.
# Tras habilitarlo, en el .env del servidor: COOKIE_SECURE=1, ENABLE_HSTS=1, TRUST_PROXY=1, HOST=127.0.0.1

# Redirige HTTP -> HTTPS
server {
    listen 80;
    server_name partos.hospital.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name partos.hospital.cl;

    ssl_certificate     /etc/letsencrypt/live/partos.hospital.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partos.hospital.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API y health -> backend Node (solo en localhost).
    location ~ ^/(api|health) {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA (build de Vite).
    root /ruta/al/proyecto/libro-partos/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
